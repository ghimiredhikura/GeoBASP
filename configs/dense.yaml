      minimum_learning_rate_ratio: 0.01
    early_stopping_patience: 50
    minimum_epochs: 100
    thresholds:
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.925
    - 0.95
    - 0.975
    - 0.99
    loss:
      name: balanced_focal_tversky
      focal_weight: 0.4
      tversky_weight: 0.6
      focal_alpha: 0.75
      focal_gamma: 2.0
      tversky_false_positive_weight: 0.3
      tversky_false_negative_weight: 0.7
      smooth: 1.0
    selection_metric: validation_best_dice
    primary_split: data/processed/splits/model_patch_split_terrain.csv
    require_confirmed_background: true
