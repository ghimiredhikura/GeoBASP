name: frozen_convnextv2_tiny_25pct_comparison_selected_v2
frozen_on: 2026-08-26
selection_basis: validation_only
selection_note: >-
  For GeoBASP, the higher-validation-Dice recovery was retained independently
  for each seed from its archived and repeated executions. The repeated seed-2028
  ConvNeXt-V2-Tiny checkpoint had the highest validation Dice among the three
  seed-wise selected runs at nominal 25% MAC reduction and passed the predefined
  validation non-inferiority rule. Archived seed-2028 Taylor and magnitude
  checkpoints provide the matched baseline comparison.
data_config: configs/data_terrain.yaml
output_root: generated/evaluation/held_out
batch_size: 2
threshold_step: 0.005
bootstrap_replicates: 10000
bootstrap_seed: 2026
noninferiority_margin: -0.02
boundary_width_pixels: 2
component_size_edges_pixels: [9, 25, 100]

configurations:
  - id: convnextv2_tiny_geobasp_mac25_seed2028_repeat
    model: convnextv2_tiny
    method: geobasp
    nominal_mac_reduction: 0.25
