sirfp:
  seeds:
  - 2026
  - 2027
  - 2028
  targets:
  - 0.25
  - 0.5
  - 0.7
  recovery:
    optimizer: adamw
    epochs_per_stage: 30
    encoder_learning_rate: 1.0e-05
    decoder_learning_rate: 0.0001
    weight_decay: 0.0001
    batch_size: 8
    validation_batch_size: 2
    crop_size: 384
    amp: true
    gradient_clip_norm: 1.0
    num_workers: 4
    warmup_epochs: 2
    minimum_learning_rate_ratio: 0.01
    distillation: false
    checkpoint_selection: validation_dice
  statistics:
    validation_noninferiority_margin_dice: -0.02
    spatial_block_bootstrap_replicates: 10000
    spatial_block_bootstrap_seed: 2026
  extended_validation:
    enabled: true
    batch_size: 2
    boundary_width_pixels: 2
    component_size_edges_pixels:
    - 9
    - 25
    - 100
  micro_channel_pruning_ratio: 0.01
  maximum_microsteps_per_target: 32
  maximum_target_absolute_error: 0.02
  mac_measurement_image_size: 512
  graph_collection:
    phase: Frozen model at the beginning of each progressive stage, after previous
      recovery
    split: train
    positive_patches: 24
    negative_patches: 8
    batch_size: 1
    augmentation: false
    patch_size: 512
    alpha: 0.99
    feature_hooks: Conv2d outputs, except protected stem and classifier
    probability: Absolute activation magnitude, spatial L1 normalization; zero map
      uniform
    redundancy: ln(2) minus Jensen-Shannon divergence, Eq. (3), all spatial pixels
    initialization: Zero redundancy EMA; common 32 updates per layer
    within_stage: Slice graphs after physical channel removal; recompute greedy retained-set
      degrees at each micro-step
    dependency_aggregation: Mean pairwise graph over coupled convolution outputs
    global_score: Negative greedy deletion degree; no per-group normalizer
    tie_rule: Stable lowest channel index
  models:
  - resnet50
  - convnextv2_tiny
  data_config: configs/data_terrain.yaml
  output_root: generated/sirfp
