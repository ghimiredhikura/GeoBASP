main:
  name: main_pruning_comparison
  pruning_config: configs/pruning.yaml
  output_root: generated/pruning/candidate_runs/archived
  minimum_free_disk_gb: 20
  continue_on_error: true
  test_data_accessed: false
  skip_methods: []
  main_matrix:
    seeds:
    - 2026
    - 2027
    - 2028
    models:
    - resnet50
    - convnextv2_tiny
    - segformer_b2
    methods:
    - group_magnitude
    - group_taylor
    - geobasp
    targets:
    - 0.25
    - 0.5
    - 0.7
    recovery_epochs: 30
  ablations: *id001
components:
  targets:
  - 0.25
  - 0.5
  recovery:
    optimizer: adamw
    epochs_per_stage: 30
    encoder_learning_rate: 1.0e-05
    decoder_learning_rate: 0.0001
    weight_decay: 0.0001
    batch_size: 8
    validation_batch_size: 2
    crop_size: 384
    amp: true
    gradient_clip_norm: 1.0
    num_workers: 4
    warmup_epochs: 2
    minimum_learning_rate_ratio: 0.01
    distillation: false
    checkpoint_selection: validation_dice
  statistics:
    validation_noninferiority_margin_dice: -0.02
    spatial_block_bootstrap_replicates: 10000
    spatial_block_bootstrap_seed: 2026
  extended_validation:
    enabled: true
    batch_size: 2
    boundary_width_pixels: 2
    component_size_edges_pixels:
    - 9
    - 25
    - 100
  micro_channel_pruning_ratio: 0.01
  maximum_microsteps_per_target: 32
  maximum_target_absolute_error: 0.02
  mac_measurement_image_size: 512
  data_config: configs/data_terrain.yaml
  output_root: generated/components
  model_name: resnet50
  variants:
  - id: overall_mean
    regimes:
    - overall
    geographic_aggregation: false
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
    description: Overall sensitivity; arithmetic mean across training blocks
    table_label: Overall sensitivity
  - id: overall_boundary_mean
    regimes:
    - overall
    - boundary
    geographic_aggregation: false
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
      boundary: 1.0
    description: Add boundary sensitivity
    table_label: + boundary
  - id: overall_boundary_small_mean
    regimes:
    - overall
    - boundary
    - small
    geographic_aggregation: false
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
      boundary: 1.0
      small: 1.0
    description: Add small-patch sensitivity
    table_label: + small scar
  - id: four_regimes_mean
    regimes:
    - overall
    - boundary
    - small
    - hard_negative
    geographic_aggregation: false
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
      boundary: 1.0
      small: 1.0
      hard_negative: 1.0
    description: Add hard-negative sensitivity; all four regimes
    table_label: All regimes, no geography
  - id: four_regimes_geo
    regimes:
    - overall
    - boundary
    - small
    - hard_negative
    geographic_aggregation: true
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
      boundary: 1.0
      small: 1.0
      hard_negative: 1.0
    description: All four regimes with geographic median plus MAD
    table_label: "+ geographic median\u2013MAD"
  - id: full_geobasp
    regimes:
    - overall
    - boundary
    - small
    - hard_negative
    geographic_aggregation: true
    cost_aware: true
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
      boundary: 1.0
      small: 1.0
      hard_negative: 1.0
    description: Full GeoBASP with submitted MAC-cost flag on; original implementation
      unchanged. Configuration name does not establish an independently effective
      utility benefit.
    table_label: Full GeoBASP (+ MAC utility)
  - id: overall_geo
    regimes:
    - overall
    geographic_aggregation: true
    cost_aware: false
    beta: 1.0
    boundary_width_pixels: 2
    regime_weights:
      overall: 1.0
    description: Overall sensitivity with geographic median plus MAD
    table_label: "Overall sensitivity + geographic median\u2013MAD"
  recovery_seeds:
  - 2026
  - 2027
  - 2028
  calibration_seed: 2026
  protect_final_features: true
